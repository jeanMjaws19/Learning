
services:
    my_app:
        build:
            context: ./SingleStage/
            dockerfile: dockerfile.singlestage

        deploy:
            mode : replicated
            replicas: 4

        restart: always

        environment:
            - PORT=3030

        networks:
            - front-network
        
    proxy:
        image: nginx:latest

        volumes:
            - ./nginx.conf:/etc/nginx/nginx.conf:ro

        ports:
            - 8080:80

        depends_on: 
            - my_app

        networks:
            - front-network


networks:
    front-network:
        driver: bridge